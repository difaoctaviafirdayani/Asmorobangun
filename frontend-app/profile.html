<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Akun Saya — Asmorobangun</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="topbar"><div class="topbar-row"><div class="wordmark" style="font-size:1.05rem">Akun Saya</div></div></div>
  <div class="section" id="profileWrap">Memuat...</div>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
function render() {
  const wrap = document.getElementById("profileWrap");
  if (!isLoggedIn()) {
    wrap.innerHTML = `<div class="card card-pad" style="text-align:center">
      <p>Kamu belum masuk.</p>
      <a class="btn btn-primary" href="login.html">Masuk</a>
      <a class="btn btn-outline" style="margin-top:10px" href="register.html">Daftar Akun</a>
    </div>`;
    return;
  }
  const u = currentUser();
  wrap.innerHTML = `
    <div class="card card-pad" style="text-align:center;margin-bottom:16px">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--wood-800);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 10px">${u.name.charAt(0).toUpperCase()}</div>
      <h3>${u.name}</h3>
      <div style="font-size:0.8rem;color:var(--ink-soft)">${u.email}</div>
    </div>
    <div class="menu-list" style="padding:0">
      <a class="menu-row" href="my-orders.html"><div class="m-icon">🧾</div><div class="m-body"><div class="m-title">Pesanan &amp; Pendaftaran Saya</div></div></a>
      <a class="menu-row" href="forum.html"><div class="m-icon">💬</div><div class="m-body"><div class="m-title">Diskusi Saya</div></div></a>
      <a class="menu-row" href="index.html#lokasi"><div class="m-icon">📍</div><div class="m-body"><div class="m-title">Lokasi Sanggar</div></div></a>
      <a class="menu-row" href="https://wa.me/6281234567890" target="_blank"><div class="m-icon">💬</div><div class="m-body"><div class="m-title">Hubungi Admin (WhatsApp)</div></div></a>
    </div>
    <button class="btn btn-outline" style="margin-top:18px" onclick="logout()">Keluar</button>
  `;
}
function logout() { clearSession(); render(); showToast("Berhasil keluar."); }
render();
renderChrome("profile");
</script>
</body>
</html>

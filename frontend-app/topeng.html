<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Toko Topeng — Asmorobangun</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="topbar-row">
      <button class="icon-btn" onclick="location.href='index.html'">←</button>
      <div class="wordmark" style="font-size:1.05rem">Toko Topeng Malangan</div>
    </div>
  </div>
  <div class="section">
    <p style="font-size:0.85rem;color:var(--ink-soft)">Setiap topeng diukir tangan oleh pengrajin sanggar. Bisa request nama & desain custom saat memesan.</p>
  </div>
  <div class="tile-grid" id="grid"></div>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
async function load() {
  const { topeng } = await api("/topeng");
  document.getElementById("grid").innerHTML = topeng
    .map(
      (t) => `<a class="tile" style="padding:0;overflow:hidden" href="topeng-detail.html?id=${t.id}">
        <img src="assets/${t.image}" onerror="this.src='https://images.unsplash.com/photo-1601924582970-9238bcb495d9?w=400'" style="width:100%;height:120px;object-fit:cover"/>
        <div style="padding:10px">
          <div class="t-title">${t.name}</div>
          <div class="t-sub">${t.character}</div>
          <div style="font-weight:700;color:var(--wood-800);margin-top:4px;font-size:0.85rem">${formatRupiah(t.price)}</div>
        </div>
      </a>`
    )
    .join("");
}
load();
renderChrome("topeng");
</script>
</body>
</html>

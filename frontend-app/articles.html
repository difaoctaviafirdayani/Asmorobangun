<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artikel & Berita — Asmorobangun</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="topbar-row">
      <button class="icon-btn" onclick="location.href='index.html'">←</button>
      <div class="wordmark" style="font-size:1.05rem">Artikel &amp; Berita</div>
      <button class="icon-btn" onclick="openSearch()">🔍</button>
    </div>
    <div class="search-bar">
      <span>🔍</span>
      <input id="qInput" placeholder="Cari berita lama..." oninput="onSearch()" />
    </div>
  </div>

  <div class="section" style="padding-top:12px;display:flex;gap:8px;overflow-x:auto" id="catRow"></div>

  <div class="section" id="featuredWrap"></div>

  <div class="section">
    <div class="section-head"><h3>Semua artikel</h3></div>
    <div id="articleList" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
let activeCategory = "";
async function loadCategories() {
  const data = await api("/articles/categories");
  const row = document.getElementById("catRow");
  const chip = (label, val) => `<button class="tag" style="background:${val===activeCategory?'var(--wood-800)':'var(--cream-300)'};color:${val===activeCategory?'#fff':'var(--wood-900)'};border:none" onclick="setCategory('${val}')">${label}</button>`;
  row.innerHTML = chip("Semua", "") + data.categories.map((c) => chip(c, c)).join("");
}
function setCategory(c) {
  activeCategory = c;
  loadCategories();
  loadArticles();
}
async function onSearch() { loadArticles(); }

async function loadArticles() {
  const q = document.getElementById("qInput").value;
  const params = new URLSearchParams();
  if (q) params.set("q", q);
  if (activeCategory) params.set("category", activeCategory);
  const data = await api(`/articles?${params.toString()}`);

  const featWrap = document.getElementById("featuredWrap");
  if (data.featured && !q && !activeCategory) {
    const a = data.featured;
    featWrap.innerHTML = `<a class="card" href="article-detail.html?slug=${a.slug}" style="display:block">
      <img class="thumb" style="height:160px" src="assets/${a.image}" onerror="this.src='https://images.unsplash.com/photo-1596496181848-3091d4878b24?w=600'"/>
      <div class="card-pad"><span class="tag gold">Sorotan Utama</span><h3 style="margin-top:8px">${a.title}</h3><p style="font-size:0.85rem;color:var(--ink-soft)">${a.excerpt}</p></div>
    </a>`;
  } else {
    featWrap.innerHTML = "";
  }

  const list = document.getElementById("articleList");
  const items = data.articles.filter((a) => !(data.featured && a.id === data.featured.id) || q || activeCategory);
  list.innerHTML = items.length
    ? items
        .map(
          (a) => `<a class="card" href="article-detail.html?slug=${a.slug}" style="display:flex;overflow:hidden">
            <img src="assets/${a.image}" onerror="this.src='https://images.unsplash.com/photo-1596496181848-3091d4878b24?w=300'" style="width:96px;height:96px;object-fit:cover;flex-shrink:0"/>
            <div style="padding:10px 12px;min-width:0">
              <span class="tag" style="font-size:0.6rem">${a.category}</span>
              <div style="font-weight:700;font-size:0.86rem;margin:4px 0;color:var(--wood-950)">${a.title}</div>
              <div style="font-size:0.72rem;color:var(--ink-soft)">${formatDate(a.date)}</div>
            </div>
          </a>`
        )
        .join("")
    : `<div class="empty-state"><div class="e-icon">📰</div>Belum ada artikel yang cocok.</div>`;
}

loadCategories();
loadArticles();
renderChrome("");
</script>
</body>
</html>

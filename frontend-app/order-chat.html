<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pesanan Topeng — Asmorobangun</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="back-row"><button class="back-btn" onclick="location.href='my-orders.html'">←</button></div>
  <div id="content" class="section">Memuat...</div>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
if (!requireLoginOrRedirect()) { /* redirected */ }
const oid = new URLSearchParams(location.search).get("id");

async function load() {
  const { order } = await api(`/topeng/orders/${oid}`, { auth: true });
  const [label, tone] = statusLabel(order.status);
  document.getElementById("content").innerHTML = `
    <h2>${order.topengName}</h2>
    <div class="card card-pad" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:0.85rem"><span>Jumlah</span><strong>${order.qty}</strong></div>
      <div style="display:flex;justify-content:space-between;font-size:0.85rem"><span>Total</span><strong>${formatRupiah(order.total)}</strong></div>
      ${order.customName ? `<div style="display:flex;justify-content:space-between;font-size:0.85rem"><span>Nama custom</span><strong>${order.customName}</strong></div>` : ""}
      ${order.customDesign ? `<div style="font-size:0.8rem;color:var(--ink-soft);margin-top:6px">Desain custom: ${order.customDesign}</div>` : ""}
      <div style="margin-top:8px"><span class="status-chip ${tone}">${label}</span></div>
    </div>

    <div class="section-head"><h3 style="font-size:0.95rem">Chat dengan admin</h3></div>
    <div class="chat-thread" id="chatThread">
      ${order.chatLog.map((m) => `<div class="chat-bubble ${m.from}">${m.text}</div>`).join("")}
    </div>
    <div class="chat-input-row">
      <input id="chatInput" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter')sendMsg()" />
      <button class="btn btn-primary btn-sm" onclick="sendMsg()">Kirim</button>
    </div>

    <div class="section" style="padding:20px 0 0" id="paymentSection">
      <div class="section-head"><h3 style="font-size:0.95rem">Pembayaran</h3></div>
      <div class="card card-pad">
        ${order.proofFile
          ? `<p>Bukti pembayaran sudah diunggah, menunggu verifikasi admin.</p>`
          : `<div class="field"><label>Metode pembayaran</label>
              <div class="pill-choice">
                <label><input type="radio" name="payMethod" value="qris" checked onchange="onPayMethodChange()"/><span>QRIS</span></label>
                <label><input type="radio" name="payMethod" value="transfer" onchange="onPayMethodChange()"/><span>Transfer</span></label>
                <label><input type="radio" name="payMethod" value="cash" onchange="onPayMethodChange()"/><span>COD / Tunai</span></label>
              </div>
             </div>
             <div id="qrisArea"></div>
             <div class="field" style="margin-top:10px"><label>Unggah bukti pembayaran</label><input type="file" id="proofFile" accept="image/*,.pdf"/></div>
             <button class="btn btn-primary" onclick="uploadProof()">Unggah Bukti</button>`
        }
      </div>
    </div>
  `;
  document.getElementById("chatThread").scrollTop = 999999;
  if (!order.proofFile) onPayMethodChange();
}

async function onPayMethodChange() {
  const method = document.querySelector('input[name="payMethod"]:checked').value;
  const area = document.getElementById("qrisArea");
  if (method === "cash") {
    area.innerHTML = `<div class="field-hint" style="margin-top:8px">Bayar tunai saat topeng diambil/diantar (COD).</div>`;
    return;
  }
  area.innerHTML = `<div class="qr-box" style="margin-top:10px">Memuat QRIS...</div>`;
  try {
    const { qris, amount } = await api(`/topeng/orders/${oid}/qris`, { auth: true });
    area.innerHTML = `<div class="qr-box" style="margin-top:10px"><img src="${qris}"/><div style="font-weight:700">${formatRupiah(amount)}</div><div class="field-hint">QRIS simulasi untuk keperluan demo</div></div>`;
  } catch (e) {}
}

async function sendMsg() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  try {
    await api(`/topeng/orders/${oid}/message`, { method: "POST", auth: true, body: { text } });
    load();
  } catch (err) {
    showToast(err.message);
  }
}

async function uploadProof() {
  const fileInput = document.getElementById("proofFile");
  if (!fileInput.files.length) return showToast("Pilih file bukti pembayaran dulu.");
  const fd = new FormData();
  fd.append("proof", fileInput.files[0]);
  try {
    await api(`/topeng/orders/${oid}/proof`, { method: "POST", auth: true, isForm: true, body: fd });
    showToast("Bukti pembayaran diunggah!");
    load();
  } catch (err) {
    showToast(err.message);
  }
}

load();
renderChrome("topeng");
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelola Pengumuman — Admin Asmorobangun</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <main class="main">
    <div class="page-head">
      <div><h1>Kelola Pengumuman</h1><p>Broadcast informasi ke semua pengguna — tampil sebagai "status" di beranda aplikasi.</p></div>
      <button class="btn btn-primary" onclick="openNew()">+ Buat Pengumuman</button>
    </div>
    <div class="card-list" id="list">Memuat...</div>
  </main>
</div>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>Buat Pengumuman</h3>
    <div class="field"><label>Judul</label><input id="fTitle" /></div>
    <div class="field"><label>Tipe label</label><input id="fType" placeholder="mis. Pendaftaran dibuka, Info Pertunjukan" /></div>
    <div class="field"><label>Isi pengumuman</label><textarea id="fBody" rows="3"></textarea></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="save()">Terbitkan</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
async function load() {
  const { announcements } = await api("/announcements");
  document.getElementById("list").innerHTML = announcements.map((a) => `
    <div class="thumb-list-item">
      <div style="flex:1">
        <span class="status-chip ok">${a.type}</span>
        <strong style="display:block;margin-top:4px">${a.title}</strong>
        <p style="margin:4px 0;font-size:0.85rem;color:var(--ink-soft)">${a.body}</p>
        <div style="font-size:0.75rem;color:var(--ink-soft)">${formatDate(a.date)}</div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="del('${a.id}')">Hapus</button>
    </div>
  `).join("") || `<div class="empty-state">Belum ada pengumuman.</div>`;
}
function openNew() {
  ["fTitle","fType","fBody"].forEach((id) => document.getElementById(id).value = "");
  document.getElementById("editModal").classList.add("open");
}
function closeModal() { document.getElementById("editModal").classList.remove("open"); }
async function save() {
  const body = {
    title: document.getElementById("fTitle").value,
    type: document.getElementById("fType").value || "Pengumuman",
    body: document.getElementById("fBody").value,
  };
  if (!body.title || !body.body) return showToast("Judul dan isi wajib diisi.");
  try { await api("/announcements", { method: "POST", body }); showToast("Pengumuman diterbitkan."); closeModal(); load(); }
  catch (err) { showToast(err.message); }
}
async function del(id) {
  if (!confirm("Hapus pengumuman ini?")) return;
  try { await api(`/announcements/${id}`, { method: "DELETE" }); showToast("Dihapus."); load(); }
  catch (err) { showToast(err.message); }
}
load();
renderSidebar("pengumuman");
</script>
</body>
</html>

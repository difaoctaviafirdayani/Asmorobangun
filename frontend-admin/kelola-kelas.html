<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelola Kelas — Admin Asmorobangun</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <main class="main">
    <div class="page-head"><div><h1>Kelola Kelas &amp; Fasilitas</h1><p>Perbarui deskripsi, info harga, dan jadwal tiap layanan sanggar.</p></div></div>
    <div class="card-list" id="list">Memuat...</div>
  </main>
</div>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3 id="modalTitle">Edit Fasilitas</h3>
    <input type="hidden" id="editId" />
    <div class="field"><label>Nama</label><input id="editName" /></div>
    <div class="field"><label>Info harga (ditampilkan ke pengguna)</label><input id="editPriceInfo" /></div>
    <div class="field"><label>Deskripsi singkat</label><textarea id="editShortDesc" rows="2"></textarea></div>
    <div class="field"><label>Deskripsi lengkap</label><textarea id="editLongDesc" rows="4"></textarea></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveEdit()">Simpan</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
const ICONS = { "panggilan-tari": "", "kunjungan-edukasi": "⭐", "les-tari-wisata": "⭐", "les-tari-reguler": "⭐", "les-karawitan": "⭐", "sewa-kostum": "⭐" };
async function load() {
  const { facilities } = await api("/facilities");
  document.getElementById("list").innerHTML = facilities.map((f) => `
    <div class="thumb-list-item">
      <div style="font-size:2rem;width:64px;text-align:center">${ICONS[f.id] || "⭐"}</div>
      <div style="flex:1">
        <strong>${f.name}</strong> <span style="color:var(--ink-soft);font-size:0.78rem">· ${f.category}</span>
        <p style="margin:4px 0;font-size:0.85rem;color:var(--ink-soft)">${f.shortDesc}</p>
        <div style="font-size:0.82rem;font-weight:600;color:var(--wood-800)">${f.priceInfo}</div>
        ${f.avgRating ? `<div style="font-size:0.78rem;margin-top:4px">⭐ ${f.avgRating} (${f.reviewCount} ulasan)</div>` : ""}
      </div>
      <button class="btn btn-outline btn-sm" onclick='openEdit(${JSON.stringify(f).replace(/'/g, "&apos;")})'>Edit</button>
    </div>
  `).join("");
}
function openEdit(f) {
  document.getElementById("editId").value = f.id;
  document.getElementById("modalTitle").textContent = "Edit: " + f.name;
  document.getElementById("editName").value = f.name;
  document.getElementById("editPriceInfo").value = f.priceInfo;
  document.getElementById("editShortDesc").value = f.shortDesc;
  document.getElementById("editLongDesc").value = f.longDesc;
  document.getElementById("editModal").classList.add("open");
}
function closeModal() { document.getElementById("editModal").classList.remove("open"); }
async function saveEdit() {
  const id = document.getElementById("editId").value;
  const body = {
    name: document.getElementById("editName").value,
    priceInfo: document.getElementById("editPriceInfo").value,
    shortDesc: document.getElementById("editShortDesc").value,
    longDesc: document.getElementById("editLongDesc").value,
  };
  try {
    await api(`/facilities/${id}`, { method: "PATCH", body });
    showToast("Fasilitas diperbarui.");
    closeModal();
    load();
  } catch (err) { showToast(err.message); }
}
load();
renderSidebar("kelas");
</script>
</body>
</html>

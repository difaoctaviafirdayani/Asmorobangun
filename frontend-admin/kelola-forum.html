<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelola Forum — Admin Asmorobangun</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <main class="main">
    <div class="page-head"><div><h1>Kelola Forum Diskusi</h1><p>Balas pertanyaan pengguna dan moderasi thread diskusi (menggantikan FAQ statis).</p></div></div>
    <div class="card-list" id="list">Memuat...</div>
  </main>
</div>

<div class="modal-bg" id="replyModal">
  <div class="modal">
    <h3 id="rmTitle">Balas Diskusi</h3>
    <div id="rmThreadBody" style="font-size:0.85rem;color:var(--ink-soft);margin-bottom:12px"></div>
    <div id="rmReplies" style="margin-bottom:12px"></div>
    <input type="hidden" id="rmThreadId" />
    <div class="field"><label>Balasan sebagai Admin Sanggar</label><textarea id="rmReplyText" rows="3"></textarea></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" onclick="closeModal()">Tutup</button>
      <button class="btn btn-primary" onclick="sendReply()">Kirim Balasan</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
async function load() {
  const { threads } = await api("/forum");
  document.getElementById("list").innerHTML = threads.map((t) => `
    <div class="thumb-list-item">
      <div style="flex:1">
        <span class="status-chip wait">${t.category}</span>
        <strong style="display:block;margin-top:4px">${t.title}</strong>
        <div style="font-size:0.78rem;color:var(--ink-soft)">${t.userName} · ${formatDate(t.date)} · ${t.replyCount} balasan</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="openThread('${t.id}')">Balas</button>
      <button class="btn btn-danger btn-sm" onclick="del('${t.id}')">Hapus</button>
    </div>
  `).join("") || `<div class="empty-state">Belum ada diskusi.</div>`;
}
async function openThread(id) {
  const { thread } = await api(`/forum/${id}`);
  document.getElementById("rmThreadId").value = id;
  document.getElementById("rmTitle").textContent = thread.title;
  document.getElementById("rmThreadBody").textContent = `${thread.userName}: ${thread.content}`;
  document.getElementById("rmReplies").innerHTML = thread.replies.map((r) => `<div style="padding:8px;background:var(--cream-200);border-radius:8px;margin-bottom:6px;font-size:0.84rem"><strong>${r.userName}</strong>: ${r.content}</div>`).join("");
  document.getElementById("rmReplyText").value = "";
  document.getElementById("replyModal").classList.add("open");
}
function closeModal() { document.getElementById("replyModal").classList.remove("open"); }
async function sendReply() {
  const id = document.getElementById("rmThreadId").value;
  const content = document.getElementById("rmReplyText").value.trim();
  if (!content) return;
  try {
    await api(`/forum/${id}/replies`, { method: "POST", body: { content } });
    showToast("Balasan terkirim.");
    openThread(id);
    load();
  } catch (err) { showToast(err.message); }
}
async function del(id) {
  if (!confirm("Hapus thread diskusi ini?")) return;
  try { await api(`/forum/${id}`, { method: "DELETE" }); showToast("Dihapus."); load(); }
  catch (err) { showToast(err.message); }
}
load();
renderSidebar("forum");
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelola Edukasi Budaya — Admin Asmorobangun</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <main class="main">
    <div class="page-head"><div><h1>Kelola Edukasi Budaya</h1><p>Kelola linimasa sejarah dan paragraf informasi Topeng Malangan yang tampil di halaman edukasi.</p></div></div>

    <div class="panel">
      <div class="panel-head"><h3>Linimasa Sejarah</h3></div>
      <div class="panel-body" style="padding-top:14px">
        <div class="card-list" id="timelineList"></div>
        <div class="grid-2" style="margin-top:16px">
          <div class="field"><label>Tahun / periode</label><input id="tlYear" placeholder="mis. 1978" /></div>
          <div class="field"><label>Keterangan</label><input id="tlText" placeholder="Peristiwa penting..." /></div>
        </div>
        <button class="btn btn-primary" onclick="addPoint()">+ Tambah Poin Linimasa</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Paragraf Informasi</h3></div>
      <div class="panel-body" style="padding-top:14px">
        <div class="field"><textarea id="paragraphInput" rows="6"></textarea></div>
        <button class="btn btn-primary" onclick="saveParagraph()">Simpan Paragraf</button>
      </div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
async function load() {
  const { cultureInfo } = await api("/culture");
  document.getElementById("timelineList").innerHTML = cultureInfo.timeline.map((t) => `
    <div class="thumb-list-item">
      <div style="font-weight:700;width:110px;color:var(--wood-800)">${t.year}</div>
      <div style="flex:1;font-size:0.88rem">${t.text}</div>
      <button class="btn btn-danger btn-sm" onclick="delPoint('${t.id}')">Hapus</button>
    </div>
  `).join("") || `<div class="empty-state">Belum ada poin linimasa.</div>`;
  document.getElementById("paragraphInput").value = cultureInfo.paragraph;
}
async function addPoint() {
  const year = document.getElementById("tlYear").value.trim();
  const text = document.getElementById("tlText").value.trim();
  if (!year || !text) return showToast("Tahun dan keterangan wajib diisi.");
  try {
    await api("/culture/timeline", { method: "POST", body: { year, text } });
    document.getElementById("tlYear").value = "";
    document.getElementById("tlText").value = "";
    showToast("Poin ditambahkan.");
    load();
  } catch (err) { showToast(err.message); }
}
async function delPoint(id) {
  if (!confirm("Hapus poin linimasa ini?")) return;
  try { await api(`/culture/timeline/${id}`, { method: "DELETE" }); showToast("Dihapus."); load(); }
  catch (err) { showToast(err.message); }
}
async function saveParagraph() {
  try { await api("/culture", { method: "PUT", body: { paragraph: document.getElementById("paragraphInput").value } }); showToast("Paragraf disimpan."); }
  catch (err) { showToast(err.message); }
}
load();
renderSidebar("edukasi");
</script>
</body>
</html>

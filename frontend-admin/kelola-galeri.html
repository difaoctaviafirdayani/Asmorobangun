<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelola Galeri — Admin Asmorobangun</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <main class="main">
    <div class="page-head">
      <div><h1>Kelola Galeri</h1><p>Kelola foto dan dokumentasi kegiatan sanggar yang tampil di beranda pengguna.</p></div>
      <button class="btn btn-primary" onclick="openNew()">+ Tambah Foto</button>
    </div>
    <div class="card-list" id="list">Memuat...</div>
  </main>
</div>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>Tambah Foto Galeri</h3>
    <div class="field"><label>Judul</label><input id="fTitle" /></div>
    <div class="field"><label>Nama file gambar (taruh di frontend-app/assets/) atau URL gambar</label><input id="fImage" placeholder="gallery-4.jpg atau https://..." /></div>
    <div class="field"><label>Keterangan</label><textarea id="fCaption" rows="2"></textarea></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="save()">Simpan</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
function imgSrc(image) {
  return image && image.startsWith("http") ? image : `../frontend-app/assets/${image}`;
}
async function load() {
  const { gallery } = await api("/gallery");
  document.getElementById("list").innerHTML = gallery.map((g) => `
    <div class="thumb-list-item">
      <img src="${imgSrc(g.image)}" onerror="this.src='https://images.unsplash.com/photo-1583225214464-9296029427aa?w=200'"/>
      <div style="flex:1">
        <strong>${g.title}</strong>
        <p style="margin:4px 0;font-size:0.85rem;color:var(--ink-soft)">${g.caption || "-"}</p>
        <div style="font-size:0.75rem;color:var(--ink-soft)">${formatDate(g.date)}</div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="del('${g.id}')">Hapus</button>
    </div>
  `).join("") || `<div class="empty-state">Belum ada foto di galeri.</div>`;
}
function openNew() {
  document.getElementById("fTitle").value = "";
  document.getElementById("fImage").value = "";
  document.getElementById("fCaption").value = "";
  document.getElementById("editModal").classList.add("open");
}
function closeModal() { document.getElementById("editModal").classList.remove("open"); }
async function save() {
  const body = {
    title: document.getElementById("fTitle").value,
    image: document.getElementById("fImage").value,
    caption: document.getElementById("fCaption").value,
  };
  if (!body.title || !body.image) return showToast("Judul dan gambar wajib diisi.");
  try { await api("/gallery", { method: "POST", body }); showToast("Foto ditambahkan."); closeModal(); load(); }
  catch (err) { showToast(err.message); }
}
async function del(id) {
  if (!confirm("Hapus foto ini?")) return;
  try { await api(`/gallery/${id}`, { method: "DELETE" }); showToast("Dihapus."); load(); }
  catch (err) { showToast(err.message); }
}
load();
renderSidebar("galeri");
</script>
</body>
</html>

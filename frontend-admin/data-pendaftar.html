<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Pendaftar — Admin Asmorobangun</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <main class="main">
    <div class="page-head"><div><h1>Data Pendaftar</h1><p>Kelola pendaftaran kelas, booking pentas, sewa kostum, dan pesanan topeng.</p></div></div>
    <div class="tabs" id="tabs"></div>
    <div class="panel"><div class="panel-body" style="padding-top:16px">
      <table>
        <thead><tr><th>Nama</th><th>Layanan</th><th>Info</th><th>Bayar</th><th>Status</th><th>Aksi</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6">Memuat...</td></tr></tbody>
      </table>
    </div></div>
  </main>
</div>

<div class="modal-bg" id="proofModal">
  <div class="modal">
    <h3>Bukti Pembayaran</h3>
    <img id="proofImg" style="width:100%;border-radius:8px;margin:10px 0" />
    <button class="btn btn-outline" style="width:100%;justify-content:center" onclick="document.getElementById('proofModal').classList.remove('open')">Tutup</button>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
const TABS = ["Semua", "Kelas Tari", "Karawitan", "Sewa Kostum", "Panggilan/Kunjungan", "Topeng"];
let activeTab = "Semua";
let bookings = [], orders = [];

function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map((t) => `<button class="tab-btn ${t===activeTab?'active':''}" onclick="setTab('${t}')">${t}</button>`).join("");
}
function setTab(t) { activeTab = t; renderTabs(); renderTable(); }

function matchTab(b) {
  if (activeTab === "Semua") return true;
  if (activeTab === "Topeng") return false;
  if (activeTab === "Kelas Tari") return b.facilityId === "les-tari-wisata" || b.facilityId === "les-tari-reguler";
  if (activeTab === "Karawitan") return b.facilityId === "les-karawitan";
  if (activeTab === "Sewa Kostum") return b.facilityId === "sewa-kostum";
  if (activeTab === "Panggilan/Kunjungan") return b.facilityId === "panggilan-tari" || b.facilityId === "kunjungan-edukasi";
  return false;
}

async function load() {
  const [bRes, oRes] = await Promise.all([api("/bookings"), api("/topeng/admin/orders")]);
  bookings = bRes.bookings;
  orders = oRes.orders;
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById("tbody");
  let rows = [];
  if (activeTab === "Topeng") {
    rows = orders.map((o) => {
      const [label, tone] = statusLabel(o.status);
      return `<tr>
        <td><strong>${o.userName}</strong></td>
        <td>${o.topengName} x${o.qty}${o.customName ? `<br/><span style="font-size:0.75rem;color:var(--ink-soft)">Custom: ${o.customName}</span>` : ""}</td>
        <td>${formatRupiah(o.total)}<br/><span style="font-size:0.75rem;color:var(--ink-soft)">${formatDate(o.createdAt)}</span></td>
        <td>${o.paymentMethod || "-"} ${o.proofFile ? `<br/><a href="#" onclick="showProof('${o.proofFile}');return false;" style="font-size:0.75rem;color:var(--wood-800);font-weight:600">Lihat bukti</a>` : ""}</td>
        <td><span class="status-chip ${tone}">${label}</span></td>
        <td>${orderActions(o)}</td>
      </tr>`;
    });
  } else {
    rows = bookings.filter(matchTab).map((b) => {
      const [label, tone] = statusLabel(b.status);
      return `<tr>
        <td><strong>${b.userName}</strong><br/><span style="font-size:0.75rem;color:var(--ink-soft)">${b.userEmail}</span></td>
        <td>${b.facilityName}</td>
        <td>${b.date ? formatDate(b.date) : "-"}${b.location ? `<br/><span style="font-size:0.75rem;color:var(--ink-soft)">${b.location}</span>` : ""}${b.eventType ? `<br/><span style="font-size:0.75rem;color:var(--ink-soft)">${b.eventType}</span>` : ""}${b.notes ? `<br/><span style="font-size:0.75rem;color:var(--ink-soft)">${b.notes}</span>` : ""}</td>
        <td>${b.paymentMethod || "-"} ${b.amount ? "<br/>" + formatRupiah(b.amount) : ""} ${b.proofFile ? `<br/><a href="#" onclick="showProof('${b.proofFile}');return false;" style="font-size:0.75rem;color:var(--wood-800);font-weight:600">Lihat bukti</a>` : ""}</td>
        <td><span class="status-chip ${tone}">${label}</span></td>
        <td>${bookingActions(b)}</td>
      </tr>`;
    });
  }
  tbody.innerHTML = rows.length ? rows.join("") : `<tr><td colspan="6" class="empty-state">Belum ada data.</td></tr>`;
}

function bookingActions(b) {
  if (["dikonfirmasi", "selesai", "ditolak"].includes(b.status)) return `<span style="color:var(--ink-soft);font-size:0.78rem">Selesai diproses</span>`;
  return `<div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-primary btn-sm" onclick="updateBookingStatus('${b.id}','dikonfirmasi')">Konfirmasi</button>
    <button class="btn btn-danger btn-sm" onclick="updateBookingStatus('${b.id}','ditolak')">Tolak</button>
  </div>`;
}
function orderActions(o) {
  if (["dikonfirmasi", "diproses", "dikirim", "selesai", "ditolak"].includes(o.status)) {
    return `<select onchange="updateOrderStatus('${o.id}', this.value)" style="font-size:0.78rem;padding:4px">
      ${["dikonfirmasi","diproses","dikirim","selesai","ditolak"].map((s) => `<option value="${s}" ${o.status===s?"selected":""}>${statusLabel(s)[0]}</option>`).join("")}
    </select>`;
  }
  return `<div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-primary btn-sm" onclick="updateOrderStatus('${o.id}','dikonfirmasi')">Konfirmasi</button>
    <button class="btn btn-danger btn-sm" onclick="updateOrderStatus('${o.id}','ditolak')">Tolak</button>
  </div>`;
}

async function updateBookingStatus(id, status) {
  try { await api(`/bookings/${id}/status`, { method: "PATCH", body: { status } }); showToast("Status diperbarui."); load(); }
  catch (err) { showToast(err.message); }
}
async function updateOrderStatus(id, status) {
  try { await api(`/topeng/admin/orders/${id}/status`, { method: "PATCH", body: { status } }); showToast("Status diperbarui."); load(); }
  catch (err) { showToast(err.message); }
}
function showProof(path) {
  document.getElementById("proofImg").src = fileUrl(path);
  document.getElementById("proofModal").classList.add("open");
}

renderTabs();
load();
renderSidebar("pendaftar");
</script>
</body>
</html>
